<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Baseline: Title & Meta Description -->
<title>BrewCraft Coffee | Best Coffee Shop in Gandhipuram, Coimbatore</title>
<meta name="description" content="BrewCraft Coffee - Coimbatore Gandhipuram-la best filter coffee, cold coffee & snacks. Morning 8 mani-la irundhu night 10 mani varaikum open. Vaanga, oru coffee kudikalam!" />
    
    <!-- Mobile & PWA Configuration -->
    <meta name="theme-color" content="#451a03" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Performance Optimization: Preconnect & Font Loading (Core Web Vitals) -->
    <!-- Preconnecting to font origin reduces DNS + TLS negotiation time before stylesheet download -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Social Meta Fallbacks (Updated dynamically by SEO component) -->
    <meta property="og:site_name" content="BrewCraft Coffee Roasters" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BrewCraft Coffee Roasters | Chennai Artisanal Roastery" />
    <meta property="og:description" content="Artisanal specialty coffee roasters based in Chennai, India. Sourcing single-origin South Indian coffees with precision roasting and sustainable brewing." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-[#FAF7F2] text-[#291811] antialiased selection:bg-[#E8D8C8] selection:text-[#451A03]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
